name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - "patch"
          - "minor"
          - "major"
      prerelease_type:
        description: "Prerelease type (leave empty for stable release)"
        required: false
        type: choice
        options:
          - ""
          - "alpha"
          - "beta"
          - "rc"

# ジョブごとに必要なものだけ与える
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      # 版上げのコミットとタグを push する
      contents: write
      # build-and-release.yml を起動する（GITHUB_TOKEN の push では他のワークフローが動かないため）
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # push は下の手順で明示的にトークンを渡して行う。git の設定に残さない
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: version
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          PRERELEASE_TYPE: ${{ github.event.inputs.prerelease_type }}
        run: |

          if [ -n "$PRERELEASE_TYPE" ]; then
            # Prerelease version
            if [ "$PRERELEASE_TYPE" = "alpha" ] || [ "$PRERELEASE_TYPE" = "beta" ] || [ "$PRERELEASE_TYPE" = "rc" ]; then
              NEW_VERSION=$(npm version "pre$VERSION_TYPE" --preid="$PRERELEASE_TYPE" --no-git-tag-version)
              # npm は必ず末尾に .0 を付ける（0.18.0-beta.0）。この運用では使わないので落とす。
              #
              # 番号が要るのは「行き先を固定したまま、確認をやり直す」ときだけで、
              # ここは直したら patch を上げる形にしている。alpha / beta / rc は
              # 成熟度の札であって、試行の回数を数えるものではない。
              NEW_VERSION=${NEW_VERSION%.0}
              npm version "${NEW_VERSION#v}" --no-git-tag-version --allow-same-version > /dev/null
            else
              NEW_VERSION=$(npm version "pre$VERSION_TYPE" --no-git-tag-version)
            fi
            IS_PRERELEASE="true"
          else
            # Stable release
            NEW_VERSION=$(npm version "$VERSION_TYPE" --no-git-tag-version)
            IS_PRERELEASE="false"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "tag_name=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          git add package.json package-lock.json
          git commit -m "Bump version to $NEW_VERSION"

      - name: Create and push tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" main
          git push "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$TAG_NAME"

      - name: Trigger build workflow
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-and-release.yml',
              ref: process.env.TAG_NAME,
              inputs: {
                release_type: process.env.IS_PRERELEASE === 'true' ? 'prerelease' : 'release'
              }
            })
