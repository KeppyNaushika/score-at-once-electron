name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - 'prerelease'
          - 'release'

permissions:
  contents: write

env:
  # Node.js version to use
  NODE_VERSION: '20'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: x64
            artifact_name: score-at-once-mac-x64
          - os: macos-latest
            platform: mac
            arch: arm64
            artifact_name: score-at-once-mac-arm64
          - os: windows-latest
            platform: win
            arch: x64
            artifact_name: score-at-once-windows-x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact_name: score-at-once-linux-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Clean build artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
        shell: powershell

      - name: Clean build artifacts (Unix)
        if: runner.os != 'Windows'
        run: rm -rf dist/ build/

      - name: Setup build variables (Windows)
        if: runner.os == 'Windows'
        id: vars_win
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $VERSION = $env:GITHUB_REF -replace "refs/tags/v", ""
          } else {
            $PACKAGE_VERSION = node -p "require('./package.json').version"
            $VERSION = "$PACKAGE_VERSION-dev"
          }
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Setup build variables (Unix)
        if: runner.os != 'Windows'
        id: vars_unix
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Use package.json version for manual releases
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            VERSION="$PACKAGE_VERSION-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Run linting and type checks
        run: npm run check-all

      - name: Build application
        run: npm run build

      - name: Verify Next.js build completion (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Host "Checking .next directory structure..."
          if (Test-Path ".next") {
            Get-ChildItem -Path ".next" -Force
            Write-Host "Checking critical Next.js files..."
            if (Test-Path ".next/BUILD_ID") {
              $buildId = Get-Content ".next/BUILD_ID"
              Write-Host "✓ BUILD_ID exists: $buildId"
            } else {
              Write-Host "✗ BUILD_ID missing"
            }
            if (Test-Path ".next/build-manifest.json") {
              Write-Host "✓ build-manifest.json exists"
            } else {
              Write-Host "✗ build-manifest.json missing"
            }
            if (Test-Path ".next/server") {
              Write-Host "✓ server directory exists"
            } else {
              Write-Host "✗ server directory missing"
            }
            if (Test-Path ".next/static") {
              Write-Host "✓ static directory exists"
            } else {
              Write-Host "✗ static directory missing"
            }
          } else {
            Write-Host "✗ .next directory not found"
          }
        shell: powershell

      - name: Verify Next.js build completion (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "Checking .next directory structure..."
          ls -la .next/ || echo ".next directory not found"
          echo "Checking critical Next.js files..."
          test -f .next/BUILD_ID && echo "✓ BUILD_ID exists: $(cat .next/BUILD_ID)" || echo "✗ BUILD_ID missing"
          test -f .next/build-manifest.json && echo "✓ build-manifest.json exists" || echo "✗ build-manifest.json missing"
          test -d .next/server && echo "✓ server directory exists" || echo "✗ server directory missing"
          test -d .next/static && echo "✓ static directory exists" || echo "✗ static directory missing"

      - name: Build Electron app for macOS
        if: matrix.os == 'macos-latest'
        run: npm run make:mac:${{ matrix.arch }}

      - name: Build Electron app for Windows
        if: matrix.os == 'windows-latest'
        run: npm run make:win:${{ matrix.arch }}

      - name: Build Electron app for Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run make:linux:${{ matrix.arch }}

      # Create archives for distribution
      - name: Create archive from Forge output (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Host "=== Creating Windows archive ==="

          # Use absolute paths to avoid confusion
          $rootDir = Get-Location
          Write-Host "Root directory: $rootDir"

          if (Test-Path "out\make") {
            Write-Host "Found out\make directory, searching for ZIP files..."
            $zipFiles = Get-ChildItem -Path "out\make" -Recurse -Filter "*.zip"
            Write-Host "Found $($zipFiles.Count) ZIP files:"
            $zipFiles | ForEach-Object { Write-Host "  $($_.FullName)" }

            if ($zipFiles.Count -gt 0) {
              $sourceZip = $zipFiles[0].FullName
              $version = "${{ steps.vars_win.outputs.version }}"
              $targetZip = Join-Path $rootDir "${{ matrix.artifact_name }}-$version.zip"
              Write-Host "Copying $sourceZip to $targetZip"
              Copy-Item $sourceZip $targetZip
              Write-Host "Copy completed"
            }
          } else {
            Write-Host "out\make directory not found"
          }

          # Verify final result
          $version = "${{ steps.vars_win.outputs.version }}"
          $finalZip = "${{ matrix.artifact_name }}-$version.zip"
          if (Test-Path $finalZip) {
            Write-Host "SUCCESS: $finalZip created successfully"
            $fileInfo = Get-Item $finalZip
            Write-Host "File size: $($fileInfo.Length) bytes"
          } else {
            Write-Host "ERROR: $finalZip was not created"
          }
        shell: powershell

      - name: Create archive from Forge output (Unix)
        if: runner.os != 'Windows'
        run: |
          cd out
          VERSION="${{ steps.vars_unix.outputs.version }}"
          FINAL_NAME="${{ matrix.artifact_name }}-$VERSION.zip"
          
          if [ -d "make" ]; then
            find make -name "*.zip" -exec cp {} "../$FINAL_NAME" \;
          fi
          if [ ! -f "../$FINAL_NAME" ]; then
            # Fallback: create archive from packaged app
            if [ "${{ matrix.os }}" = "macos-latest" ]; then
              zip -r "../$FINAL_NAME" "一括採点-darwin-${{ matrix.arch }}"
            else
              zip -r "../$FINAL_NAME" "一括採点-linux-${{ matrix.arch }}"
            fi
          fi
          
          echo "Created: $FINAL_NAME"
          ls -la "../$FINAL_NAME"

      # Upload artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ steps.vars_win.outputs.version || steps.vars_unix.outputs.version }}
          path: ${{ matrix.artifact_name }}-${{ steps.vars_win.outputs.version || steps.vars_unix.outputs.version }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Setup release variables
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAG_NAME=${GITHUB_REF#refs/tags/}
            RELEASE_TYPE="release"
          else
            # Use package.json version for manual releases
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            VERSION="$PACKAGE_VERSION-dev"
            TAG_NAME="v$VERSION"
            RELEASE_TYPE="${{ github.event.inputs.release_type || 'prerelease' }}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
          echo "is_prerelease=$([[ $RELEASE_TYPE == \"prerelease\" ]] && echo \"true\" || echo \"false\")" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          RELEASE_TYPE="${{ steps.vars.outputs.release_type }}"
          VERSION="${{ steps.vars.outputs.version }}"

          if [ "$RELEASE_TYPE" = "prerelease" ]; then
            NOTES="## 一括採点 $VERSION (プレリリース)

          ⚠️ **これはプレリリース版です** - テスト用途での使用を推奨します

          ### 📦 ダウンロード

          - **macOS (Intel)**: \`score-at-once-mac-x64-$VERSION.zip\`
          - **macOS (Apple Silicon)**: \`score-at-once-mac-arm64-$VERSION.zip\`
          - **Windows**: \`score-at-once-windows-x64-$VERSION.zip\`
          - **Linux**: \`score-at-once-linux-x64-$VERSION.zip\`

          ### 🧪 プレリリース版について

          この版は開発中の機能を含んでおり、予期しない動作をする可能性があります。
          本番環境での使用は避け、テストやフィードバック目的でご利用ください。

          ### ⚠️ 重要な使用制限（詳細はLICENSEファイル参照）

          - **開発段階のプレビュー版** - 動作保証なし、データ損失やシステム障害の可能性
          - **重要データのバックアップ必須** - 十分なテストが未実施のため事前バックアップ推奨
          - **再配布・転載・第三者提供禁止** - 独自使用許諾契約による制限
          - **30日間の使用期限** - 配信日から30日後にソフトウェア及び生成データを削除
          - **著作権者要請時の即時使用停止義務** - 要請時は直ちに使用中止・データ削除

          ### 🚀 機能

          限定配布・インストール不要・オフライン完結の採点支援ソフト

          ### 📝 使用方法

          1. お使いのOSに対応するZIPファイルをダウンロード
          2. 解凍してフォルダ内の実行ファイルを起動
             - macOS: \`一括採点.app\`
             - Windows: \`一括採点.exe\`
             - Linux: \`一括採点\`

          ### 🐛 フィードバック

          問題や改善点がございましたら、Issue または Discussion でお知らせください。

          ---

          **作者**: KeppyNaushika
          **バージョン**: $VERSION
          **種類**: プレリリース"
          else
            NOTES="## 一括採点 $VERSION 早期プレビュー版

          ⚠️ **これは早期プレビュー版です** - 限定配布・テスト用途

          ### 📦 ダウンロード

          - **macOS (Intel)**: \`score-at-once-mac-x64-$VERSION.zip\`
          - **macOS (Apple Silicon)**: \`score-at-once-mac-arm64-$VERSION.zip\`
          - **Windows**: \`score-at-once-windows-x64-$VERSION.zip\`
          - **Linux**: \`score-at-once-linux-x64-$VERSION.zip\`

          ### 🚀 機能

          限定配布・インストール不要・オフライン完結の採点支援ソフト

          ### 📝 使用方法

          1. お使いのOSに対応するZIPファイルをダウンロード
          2. 解凍してフォルダ内の実行ファイルを起動
             - macOS: \`一括採点.app\`
             - Windows: \`一括採点.exe\`
             - Linux: \`一括採点\`

          ### ⚠️ 重要な使用制限（詳細はLICENSEファイル参照）

          - **開発段階のプレビュー版** - 動作保証なし、データ損失やシステム障害の可能性
          - **重要データのバックアップ必須** - 十分なテストが未実施のため事前バックアップ推奨
          - **再配布・転載・第三者提供禁止** - 独自使用許諾契約による制限
          - **30日間の使用期限** - 配信日から30日後にソフトウェア及び生成データを削除
          - **著作権者要請時の即時使用停止義務** - 要請時は直ちに使用中止・データ削除

          ### 🐛 フィードバック

          不具合報告や改善提案をお待ちしています。フィードバックは今後のベータ版開発に活用させていただきます。

          ### 📄 ライセンス

          本早期プレビュー版は独自の使用許諾契約書に基づいて限定配布されます。
          将来的にはAGPL v3.0ライセンスでの公開を予定しています。
          ダウンロード、インストール、または実行により、LICENSE記載の全条件への同意とみなされます。

          ---

          **作者**: KeppyNaushika
          **バージョン**: $VERSION
          **種類**: 早期プレビュー版"
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Collect release files
        run: |
          mkdir -p release-files
          find ./artifacts -name "*.zip" -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: 一括採点 ${{ steps.vars.outputs.tag_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          prerelease: ${{ steps.vars.outputs.is_prerelease }}
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord Notification
        if: always()
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            node -e "
              const https = require('https');
              const url = new URL('${{ secrets.DISCORD_WEBHOOK_URL }}');
              const releaseUrl = 'https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.tag_name }}';
              const isPrerelease = '${{ steps.vars.outputs.is_prerelease }}' === 'true';
              const version = '${{ steps.vars.outputs.version }}';

              const payload = JSON.stringify({
                content: '@everyone',
                embeds: [{
                  title: \`一括採点 \${version} をリリースしました！\`,
                  description: \`<:app_icon:1398223842488483840> 完全無料・インストール不要・オフライン完結の採点支援ソフト\\n\\n**[📥 ダウンロード](\${releaseUrl})**\\nダウンロードしたら <:try:1393919620301324430> を押して下さい\` + (isPrerelease ? '\\n\\n⚠️ **プレリリース版です。ライセンスをご確認下さい。**' : ''),
                  color: isPrerelease ? 0xffa500 : 0x00ff00,
                  fields: [{
                    name: '📦 バージョン',
                    value: version,
                    inline: true
                  }],
                  footer: {
                    text: 'KeppyNaushika',
                    icon_url: 'https://github.com/KeppyNaushika.png'
                  },
                  timestamp: new Date().toISOString()
                }]
              });

              const options = {
                hostname: url.hostname,
                port: 443,
                path: url.pathname + '?wait=true',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(payload)
                }
              };

              const req = https.request(options, (res) => {
                console.log('Discord notification sent:', res.statusCode);
                let responseData = '';
                
                res.on('data', (chunk) => {
                  responseData += chunk;
                });
                
                res.on('end', () => {
                  console.log('Discord response completed');
                  
                  if (res.statusCode === 200 && responseData) {
                    try {
                      const messageData = JSON.parse(responseData);
                      const messageId = messageData.id;
                      const channelId = messageData.channel_id;
                      
                      if (messageId && channelId) {
                        // Add :try: reaction
                        const reactionOptions = {
                          hostname: 'discord.com',
                          port: 443,
                          path: \\`/api/v10/channels/\\${channelId}/messages/\\${messageId}/reactions/try:1393919620301324430/@me\\`,
                          method: 'PUT',
                          headers: {
                            'Authorization': 'Bot ${{ secrets.DISCORD_BOT_TOKEN }}',
                            'Content-Length': 0
                          }
                        };
                        
                        const reactionReq = https.request(reactionOptions, (reactionRes) => {
                          console.log('Discord reaction added:', reactionRes.statusCode);
                        });
                        
                        reactionReq.on('error', (error) => {
                          console.error('Discord reaction failed:', error.message);
                        });
                        
                        reactionReq.setTimeout(5000, () => {
                          reactionReq.destroy();
                          console.log('Discord reaction timeout');
                        });
                        
                        reactionReq.end();
                      }
                    } catch (error) {
                      console.error('Failed to parse Discord response:', error.message);
                    }
                  }
                });
              });

              req.on('error', (error) => {
                console.error('Discord notification failed:', error.message);
                // Don't fail the build for notification errors
              });

              req.setTimeout(10000, () => {
                req.destroy();
                console.log('Discord notification timeout');
              });

              req.write(payload);
              req.end();
            "
          else
            echo "Discord webhook URL not configured"
          fi
