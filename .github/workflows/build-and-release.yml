name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "prerelease"
        type: choice
        options:
          - "prerelease"
          - "release"

permissions:
  contents: write

env:
  # Node.js version to use
  NODE_VERSION: "22"
  # Opt into Node.js 24 for GitHub Actions runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.runner || matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: x64
            artifact_name: score-at-once-mac-x64
          - os: macos-latest
            platform: mac
            arch: arm64
            artifact_name: score-at-once-mac-arm64
          - os: windows-latest
            # windows-latest(=windows-2025-vs2026)のVS2026環境ではnode-gypのVS検出が
            # PowerShell出力のmaxBuffer超過(ERR_CHILD_PROCESS_STDIO_MAXBUFFER)で失敗し、
            # better-sqlite3のネイティブ再ビルドが落ちる。VS2022の安定環境に固定する。
            # 注: os ラベルは windows-latest のまま維持（後続の matrix.os 条件分岐が依存）
            runner: windows-2022
            platform: win
            arch: x64
            artifact_name: score-at-once-windows-x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact_name: score-at-once-linux-x64

    steps:
      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          # Clear npm cache to avoid stale binaries
          npm cache clean --force
          # Install dependencies with fresh download
          npm install --prefer-online
          # Force reinstall all Tailwind CSS v4 native modules
          # 版は package-lock.json と揃えること。ずれると lint:fix が落ちる
          # （canonicalizeTailwindClasses.mjs が Tailwind の内部 API を呼んでおり、
          #  4.1.7 には canonicalizeCandidates が無い）
          npm uninstall lightningcss @tailwindcss/oxide @tailwindcss/postcss tailwindcss
          npm install lightningcss@1.32.0 @tailwindcss/postcss@4.3.3 tailwindcss@4.3.3 --prefer-online
          # Verify native modules
          node -e "
            console.log('Node.js:', process.version, 'Platform:', process.platform, process.arch);
            const modules = ['lightningcss', '@tailwindcss/oxide'];
            modules.forEach(mod => {
              try {
                require(mod);
                console.log('✓', mod, 'loaded successfully');
              } catch (err) {
                console.error('✗', mod, 'error:', err.message);
              }
            });
          "
      - name: Ensure MathJax fonts
        run: node scripts/setup-mathjax-fonts.js

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Clean build artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
        shell: powershell

      - name: Clean build artifacts (Unix)
        if: runner.os != 'Windows'
        run: rm -rf dist/ build/

      - name: Setup build variables (Windows)
        if: runner.os == 'Windows'
        id: vars_win
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $VERSION = $env:GITHUB_REF -replace "refs/tags/v", ""
          } else {
            $PACKAGE_VERSION = node -p "require('./package.json').version"
            $VERSION = "$PACKAGE_VERSION-dev"
          }
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Setup build variables (Unix)
        if: runner.os != 'Windows'
        id: vars_unix
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Use package.json version for manual releases
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            VERSION="$PACKAGE_VERSION-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Auto-fix linting issues
        run: npm run lint:fix

      - name: Run linting and type checks
        run: npm run check-all

      - name: Build application
        run: npm run build

      - name: Verify Next.js build completion (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Host "Checking .next directory structure..."
          if (Test-Path ".next") {
            Get-ChildItem -Path ".next" -Force
            Write-Host "Checking critical Next.js files..."
            if (Test-Path ".next/BUILD_ID") {
              $buildId = Get-Content ".next/BUILD_ID"
              Write-Host "✓ BUILD_ID exists: $buildId"
            } else {
              Write-Host "✗ BUILD_ID missing"
            }
            if (Test-Path ".next/build-manifest.json") {
              Write-Host "✓ build-manifest.json exists"
            } else {
              Write-Host "✗ build-manifest.json missing"
            }
            if (Test-Path ".next/server") {
              Write-Host "✓ server directory exists"
            } else {
              Write-Host "✗ server directory missing"
            }
            if (Test-Path ".next/static") {
              Write-Host "✓ static directory exists"
            } else {
              Write-Host "✗ static directory missing"
            }
          } else {
            Write-Host "✗ .next directory not found"
          }
        shell: powershell

      - name: Verify Next.js build completion (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "Checking .next directory structure..."
          ls -la .next/ || echo ".next directory not found"
          echo "Checking critical Next.js files..."
          test -f .next/BUILD_ID && echo "✓ BUILD_ID exists: $(cat .next/BUILD_ID)" || echo "✗ BUILD_ID missing"
          test -f .next/build-manifest.json && echo "✓ build-manifest.json exists" || echo "✗ build-manifest.json missing"
          test -d .next/server && echo "✓ server directory exists" || echo "✗ server directory missing"
          test -d .next/static && echo "✓ static directory exists" || echo "✗ static directory missing"

      - name: Build Electron app for macOS
        if: matrix.os == 'macos-latest'
        run: npm run make:mac:${{ matrix.arch }}

      - name: Build Electron app for Windows
        if: matrix.os == 'windows-latest'
        run: npm run make:win:${{ matrix.arch }}

      - name: Build Electron app for Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run make:linux:${{ matrix.arch }}

      # Create archives for distribution
      - name: Create archive from Forge output (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Host "=== Creating Windows archive ==="

          # Use absolute paths to avoid confusion
          $rootDir = Get-Location
          Write-Host "Root directory: $rootDir"

          if (Test-Path "out\make") {
            Write-Host "Found out\make directory, searching for ZIP files..."
            $zipFiles = Get-ChildItem -Path "out\make" -Recurse -Filter "*.zip"
            Write-Host "Found $($zipFiles.Count) ZIP files:"
            $zipFiles | ForEach-Object { Write-Host "  $($_.FullName)" }

            if ($zipFiles.Count -gt 0) {
              $sourceZip = $zipFiles[0].FullName
              $version = "${{ steps.vars_win.outputs.version }}"
              $targetZip = Join-Path $rootDir "${{ matrix.artifact_name }}-$version.zip"
              Write-Host "Copying $sourceZip to $targetZip"
              Copy-Item $sourceZip $targetZip
              Write-Host "Copy completed"
            }
          } else {
            Write-Host "out\make directory not found"
          }

          # Verify final result
          $version = "${{ steps.vars_win.outputs.version }}"
          $finalZip = "${{ matrix.artifact_name }}-$version.zip"
          if (Test-Path $finalZip) {
            Write-Host "SUCCESS: $finalZip created successfully"
            $fileInfo = Get-Item $finalZip
            Write-Host "File size: $($fileInfo.Length) bytes"
          } else {
            Write-Host "ERROR: $finalZip was not created"
          }
        shell: powershell

      - name: Create archive from Forge output (Unix)
        if: runner.os != 'Windows'
        run: |
          cd out
          VERSION="${{ steps.vars_unix.outputs.version }}"
          FINAL_NAME="${{ matrix.artifact_name }}-$VERSION.zip"

          if [ -d "make" ]; then
            find make -name "*.zip" -exec cp {} "../$FINAL_NAME" \;
          fi
          if [ ! -f "../$FINAL_NAME" ]; then
            # Fallback: create archive from packaged app
            if [ "${{ matrix.os }}" = "macos-latest" ]; then
              zip -r "../$FINAL_NAME" "一括採点-darwin-${{ matrix.arch }}"
            else
              zip -r "../$FINAL_NAME" "一括採点-linux-${{ matrix.arch }}"
            fi
          fi

          echo "Created: $FINAL_NAME"
          ls -la "../$FINAL_NAME"

      # Upload artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ steps.vars_win.outputs.version || steps.vars_unix.outputs.version }}
          path: ${{ matrix.artifact_name }}-${{ steps.vars_win.outputs.version || steps.vars_unix.outputs.version }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Setup release variables
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAG_NAME=${GITHUB_REF#refs/tags/}
            # 版に "-" が入っていれば前段の版（0.17.0-beta / 0.18.0-rc.1 など）。
            # ここを無条件に release にしていたため、-alpha を付けたタグまで
            # 正式版として公開されていた
            if [[ $VERSION == *-* ]]; then
              RELEASE_TYPE="prerelease"
            else
              RELEASE_TYPE="release"
            fi
          else
            # Use package.json version for manual releases
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            VERSION="$PACKAGE_VERSION-dev"
            TAG_NAME="v$VERSION"
            RELEASE_TYPE="${{ github.event.inputs.release_type || 'prerelease' }}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
          echo "is_prerelease=$([[ $RELEASE_TYPE == \"prerelease\" ]] && echo \"true\" || echo \"false\")" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TYPE="${{ steps.vars.outputs.release_type }}"
          VERSION="${{ steps.vars.outputs.version }}"
          TAG_NAME="${{ steps.vars.outputs.tag_name }}"

          # 直近の前回タグ（現在のタグ自身は除外）を求める
          CURRENT_TAG=$(git tag --sort=-version:refname | head -n 1)
          LAST_TAG=$(git tag --sort=-version:refname | head -n 2 | tail -n 1)
          if [ "$CURRENT_TAG" = "$LAST_TAG" ]; then
            LAST_TAG=$(git tag --sort=-version:refname | head -n 3 | tail -n 1)
          fi
          echo "Last tag: $LAST_TAG"

          # GitHub公式のリリースノート自動生成APIでマージ済みPR一覧を取得する。
          # カテゴリ分け・除外は .github/release.yml の設定に従う。
          # 自前のPR解析・API個別呼び出し・フォールバックは廃止。
          GEN_ARGS=(
            -X POST
            "repos/${{ github.repository }}/releases/generate-notes"
            -f "tag_name=$TAG_NAME"
            -f "target_commitish=${{ github.sha }}"
          )
          if [ -n "$LAST_TAG" ]; then
            GEN_ARGS+=(-f "previous_tag_name=$LAST_TAG")
          fi

          CHANGES=$(gh api "${GEN_ARGS[@]}" -q .body || true)

          if [ -z "$CHANGES" ]; then
            echo "::warning::generate-notes API returned empty - using default message"
            CHANGES="- バグ修正と機能改善"
          fi

          echo "Generated changes:"
          echo "$CHANGES"

          if [ "$RELEASE_TYPE" = "prerelease" ]; then
            NOTES=$(VERSION="$VERSION" CHANGES="$CHANGES" node scripts/build-release-notes.js prerelease)
          else
            NOTES=$(VERSION="$VERSION" CHANGES="$CHANGES" node scripts/build-release-notes.js release)
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Collect release files
        run: |
          mkdir -p release-files
          find ./artifacts -name "*.zip" -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: 一括採点 ${{ steps.vars.outputs.tag_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          prerelease: ${{ steps.vars.outputs.is_prerelease }}
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord Notification
        if: always()
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            cat > discord_notify.js << 'EOF'
          const https = require('https');

          const webhookUrl = process.env.DISCORD_WEBHOOK_URL;
          const releaseUrl = process.env.RELEASE_URL;
          const isPrerelease = process.env.IS_PRERELEASE === 'true';
          const version = process.env.VERSION;
          const changes = process.env.CHANGES || 'バグ修正と機能改善';

          const url = new URL(webhookUrl);

          const payload = JSON.stringify({
            content: '@everyone',
            embeds: [{
              title: `📚 採点支援ソフト「一括採点」${version} が利用可能です！`,
              description: `<:app_icon:1398223842488483840> **完全無料・インストール不要・オフライン完結**\n\n**[📥 今すぐダウンロード](${releaseUrl})**` + (isPrerelease ? '\n\n⚠️ **テスト版につきご留意下さい。**' : ''),
              color: isPrerelease ? 0xffa500 : 0x00ff00,
              fields: [{
                name: '📦 バージョン',
                value: version,
                inline: true
              }, {
                name: '🔄 主な変更点',
                value: changes.split('\n').slice(0, 5).join('\n') || 'バグ修正と機能改善',
                inline: false
              }],
              footer: {
                text: 'KeppyNaushika',
                icon_url: 'https://github.com/KeppyNaushika.png'
              },
              timestamp: new Date().toISOString()
            }]
          });

          const options = {
            hostname: url.hostname,
            port: 443,
            path: url.pathname,
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(payload)
            }
          };

          const req = https.request(options, (res) => {
            console.log('Discord notification sent:', res.statusCode);
            let responseData = '';

            res.on('data', (chunk) => {
              responseData += chunk;
            });

            res.on('end', () => {
              console.log('Discord webhook sent successfully');
            });
          });

          req.on('error', (error) => {
            console.error('Discord notification failed:', error.message);
          });

          req.setTimeout(10000, () => {
            req.destroy();
            console.log('Discord notification timeout');
          });

          req.write(payload);
          req.end();
          EOF

            # Format changes for Discord (clean up markdown and limit length, keep line breaks)
            DISCORD_CHANGES=$(
              printf '%s\n' '${{ steps.release_notes.outputs.changes }}' \
                | sed 's/###/•/g' \
                | sed 's/🔀//g' \
                | awk 'NF' \
                | head -8
            )
            
            DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK_URL }}" \
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.tag_name }}" \
            IS_PRERELEASE="${{ steps.vars.outputs.is_prerelease }}" \
            VERSION="${{ steps.vars.outputs.version }}" \
            CHANGES="$DISCORD_CHANGES" \
            node discord_notify.js
          else
            echo "Discord webhook URL not configured"
          fi
