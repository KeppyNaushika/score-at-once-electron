name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - 'prerelease'
          - 'release'

permissions:
  contents: write

env:
  # Node.js version to use
  NODE_VERSION: '20'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: x64
            artifact_name: 一括採点-mac-x64
          - os: macos-latest
            platform: mac
            arch: arm64
            artifact_name: 一括採点-mac-arm64
          - os: windows-latest
            platform: win
            arch: x64
            artifact_name: 一括採点-windows-x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact_name: 一括採点-linux-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linting and type checks
        run: npm run check-all

      - name: Clean build artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
        shell: powershell
        
      - name: Clean build artifacts (Unix)
        if: runner.os != 'Windows'
        run: rm -rf dist/ build/

      - name: Build Electron app for macOS
        if: matrix.os == 'macos-latest'
        run: npx electron-forge make --platform=darwin --arch=${{ matrix.arch }}

      - name: Build Electron app for Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-forge make --platform=win32 --arch=${{ matrix.arch }}

      - name: Build Electron app for Linux
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-forge make --platform=linux --arch=${{ matrix.arch }}

      # Create archives for distribution
      - name: Create archive from Forge output (Windows)
        if: runner.os == 'Windows'
        run: |
          cd out
          if (Test-Path "make") {
            $zipFile = Get-ChildItem -Path "make" -Recurse -Filter "*.zip" | Select-Object -First 1
            if ($zipFile) {
              Copy-Item $zipFile.FullName "../${{ matrix.artifact_name }}.zip"
            }
          }
          if (!(Test-Path "../${{ matrix.artifact_name }}.zip")) {
            Compress-Archive -Path "一括採点-win32-${{ matrix.arch }}" -DestinationPath "../${{ matrix.artifact_name }}.zip"
          }
        shell: powershell
        
      - name: Create archive from Forge output (Unix)
        if: runner.os != 'Windows'
        run: |
          cd out
          if [ -d "make" ]; then
            find make -name "*.zip" -exec cp {} ../${{ matrix.artifact_name }}.zip \;
          fi
          if [ ! -f "../${{ matrix.artifact_name }}.zip" ]; then
            # Fallback: create archive from packaged app
            if [ "${{ matrix.os }}" = "macos-latest" ]; then
              zip -r "../${{ matrix.artifact_name }}.zip" "一括採点-darwin-${{ matrix.arch }}"
            else
              zip -r "../${{ matrix.artifact_name }}.zip" "一括採点-linux-${{ matrix.arch }}"
            fi
          fi

      # Upload artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Setup release variables
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAG_NAME=${GITHUB_REF#refs/tags/}
            RELEASE_TYPE="release"
          else
            VERSION=$(date +'%Y%m%d-%H%M%S')
            TAG_NAME="v$VERSION-dev"
            RELEASE_TYPE="${{ github.event.inputs.release_type || 'prerelease' }}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
          echo "is_prerelease=$([[ $RELEASE_TYPE == \"prerelease\" ]] && echo \"true\" || echo \"false\")" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          RELEASE_TYPE="${{ steps.vars.outputs.release_type }}"
          VERSION="${{ steps.vars.outputs.version }}"

          if [ "$RELEASE_TYPE" = "prerelease" ]; then
            NOTES="## 一括採点 $VERSION (プレリリース)

          ⚠️ **これはプレリリース版です** - テスト用途での使用を推奨します

          ### 📦 ダウンロード

          - **macOS (Intel)**: \`一括採点-mac-x64.zip\`
          - **macOS (Apple Silicon)**: \`一括採点-mac-arm64.zip\`
          - **Windows**: \`一括採点-windows-x64.zip\`
          - **Linux**: \`一括採点-linux-x64.zip\`

          ### 🧪 プレリリース版について

          この版は開発中の機能を含んでおり、予期しない動作をする可能性があります。
          本番環境での使用は避け、テストやフィードバック目的でご利用ください。

          ### ⚠️ 重要な使用制限

          - **開発段階のプレビュー版** - 動作保証なし、データ損失の可能性があります
          - **テスト不十分** - 重要なデータのバックアップを推奨します
          - **再配布禁止** - 第三者への提供・転載を禁止します
          - **30日間の使用期限** - 配信日から30日後にソフトウェアを削除してください
          - **使用停止要請** - 著作権者からの要請時は直ちに使用を中止してください

          ### 🚀 機能

          完全無料・インストール不要・オフライン完結の採点支援ソフト

          ### 📝 使用方法

          1. お使いのOSに対応するZIPファイルをダウンロード
          2. 解凍してフォルダ内の実行ファイルを起動
             - macOS: \`一括採点.app\`
             - Windows: \`一括採点.exe\`
             - Linux: \`一括採点\`

          ### 🐛 フィードバック

          問題や改善点がございましたら、Issue または Discussion でお知らせください。

          ---

          **作者**: KeppyNaushika
          **バージョン**: $VERSION
          **種類**: プレリリース"
          else
            NOTES="## 一括採点 $VERSION 早期プレビュー版

          ⚠️ **これは早期プレビュー版です** - 限定配布・テスト用途

          ### 📦 ダウンロード

          - **macOS (Intel)**: \`一括採点-mac-x64.zip\`
          - **macOS (Apple Silicon)**: \`一括採点-mac-arm64.zip\`
          - **Windows**: \`一括採点-windows-x64.zip\`
          - **Linux**: \`一括採点-linux-x64.zip\`

          ### 🚀 機能

          完全無料・インストール不要・オフライン完結の採点支援ソフト

          ### 📝 使用方法

          1. お使いのOSに対応するZIPファイルをダウンロード
          2. 解凍してフォルダ内の実行ファイルを起動
             - macOS: \`一括採点.app\`
             - Windows: \`一括採点.exe\`
             - Linux: \`一括採点\`

          ### ⚠️ 重要な使用制限

          - **開発段階のプレビュー版** - 動作保証なし、データ損失の可能性があります
          - **テスト不十分** - 重要なデータのバックアップを推奨します
          - **再配布禁止** - 第三者への提供・転載を禁止します
          - **30日間の使用期限** - 配信日から30日後にソフトウェアを削除してください
          - **使用停止要請** - 著作権者からの要請時は直ちに使用を中止してください

          ### 🐛 フィードバック

          不具合報告や改善提案をお待ちしています。フィードバックは今後のベータ版開発に活用させていただきます。

          ### 📄 ライセンス

          本早期プレビュー版は独自の使用許諾契約書に基づいて限定配布されます。
          将来的にはAGPL v3.0ライセンスでの公開を予定しています。
          ダウンロードまたは実行により、契約条件への同意とみなされます。

          ---

          **作者**: KeppyNaushika
          **バージョン**: $VERSION
          **種類**: 早期プレビュー版"
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Collect release files
        run: |
          mkdir -p release-files
          find ./artifacts -name "*.zip" -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: 一括採点 ${{ steps.vars.outputs.tag_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          prerelease: ${{ steps.vars.outputs.is_prerelease }}
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord Notification
        if: always()
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            node -e "
              const https = require('https');
              const url = new URL('${{ secrets.DISCORD_WEBHOOK_URL }}');
              const releaseUrl = 'https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.tag_name }}';
              const isPrerelease = '${{ steps.vars.outputs.is_prerelease }}' === 'true';
              const version = '${{ steps.vars.outputs.version }}';

              const payload = JSON.stringify({
                content: '@everyone',
                embeds: [{
                  title: \`:app_icon: 一括採点 \${version} をリリースしました！\`,
                  description: \`完全無料・インストール不要・オフライン完結の採点支援ソフト\\n\\n**[📥 ダウンロード](\${releaseUrl})**\\nダウンロードしたら :try: を押して下さい\` + (isPrerelease ? '\\n\\n⚠️ **プレリリース版です。ライセンスをご確認下さい。**' : ''),
                  color: isPrerelease ? 0xffa500 : 0x00ff00,
                  fields: [{
                    name: '📦 バージョン',
                    value: version,
                    inline: true
                  }],
                  footer: {
                    text: 'KeppyNaushika',
                    icon_url: 'https://github.com/KeppyNaushika.png'
                  },
                  timestamp: new Date().toISOString()
                }]
              });

              const options = {
                hostname: url.hostname,
                port: 443,
                path: url.pathname + '?wait=true',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(payload)
                }
              };

              const req = https.request(options, (res) => {
                console.log('Discord notification sent:', res.statusCode);
              });

              req.on('error', (error) => {
                console.error('Discord notification failed:', error);
              });

              req.write(payload);
              req.end();
            "
          else
            echo "Discord webhook URL not configured"
          fi
